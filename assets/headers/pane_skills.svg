<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 96" width="100%" height="96">
  <defs>
    <linearGradient id="bar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1B2536"/>
      <stop offset="100%" stop-color="#161E2C"/>
    </linearGradient>
    <linearGradient id="glow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#5CF19E" stop-opacity="0.55"/>
      <stop offset="60%" stop-color="#5CF19E" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#5CF19E" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- window body -->
  <rect x="1" y="1" width="1198" height="94" rx="10" fill="#0F1520" stroke="#243044"/>
  <!-- title bar -->
  <path d="M1,38 L1,11 A10,10 0 0 1 11,1 L1189,1 A10,10 0 0 1 1199,11 L1199,38 Z" fill="url(#bar)"/>
  <line x1="1" y1="38" x2="1199" y2="38" stroke="#243044"/>
  <!-- accent underline on the bar -->
  <rect x="1" y="36" width="504.0" height="2" fill="url(#glow)"/>

  <!-- traffic lights -->
  <circle cx="26" cy="19.0" r="6" fill="#FF6B6B"/>
  <circle cx="48" cy="19.0" r="6" fill="#F2B84B"/>
  <circle cx="70" cy="19.0" r="6" fill="#5CF19E"/>

  <!-- title -->
  <text x="600.0" y="23.5" text-anchor="middle"
        font-family="ui-monospace, 'SF Mono', Consolas, monospace" font-size="13" fill="#7A8699">karima@devops-01: ~/skills</text>

  <!-- prompt line -->
  <text x="26" y="74" font-family="ui-monospace, 'SF Mono', Consolas, monospace" font-size="16">
    <tspan fill="#5CF19E" font-weight="700">$</tspan><tspan fill="#C7D3E1" xml:space="preserve"> ls ./skills --group-by=domain</tspan>
  </text>
  <rect x="299" y="60" width="9" height="18" fill="#5CF19E" opacity="0.9">
    <animate attributeName="opacity" values="0.9;0.9;0;0;0.9" dur="1.1s" repeatCount="indefinite"/>
  </rect>
</svg>